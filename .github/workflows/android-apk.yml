# Builds a debug APK on GitHub's servers, so no desktop computer is needed.
# Download it from the run's "Artifacts" section (GitHub website or app):
#   Actions tab -> latest "Android APK" run -> DeadSignal-debug-apk
name: Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Install Godot and Android templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -j -q /tmp/templates.tpz 'templates/android_*' 'templates/version.txt' -d "$dest"

      # Reusing one debug key lets new builds install over old ones
      # (while the cache lives; otherwise uninstall the old build first).
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/debug.keystore
          key: deadsignal-debug-keystore

      - name: Configure Android export
        run: |
          if [ ! -f ~/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export debug APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --path . --import
          ~/godot/godot --headless --path . --export-debug "Android" build/DeadSignal-debug.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: DeadSignal-debug-apk
          path: build/DeadSignal-debug.apk
          if-no-files-found: error
